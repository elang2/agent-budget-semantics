name: Differential Budget Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mock-llm-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: pip install -e ".[dev]"

      - name: Run mock LLM unit tests
        run: pytest tests/test_mock_llm.py -v

  differential-autogen:
    runs-on: ubuntu-latest
    needs: mock-llm-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with AutoGen
        run: pip install -e ".[autogen,dev]"

      - name: Run S2 against AutoGen
        run: python harness.py --scenario scenarios/s2_budget_exhaustion.yaml --frameworks autogen --output results/autogen.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: results-autogen
          path: results/

  differential-langchain:
    runs-on: ubuntu-latest
    needs: mock-llm-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with LangChain
        run: pip install -e ".[langchain,langgraph,dev]"

      - name: Run S2 against LangChain + LangGraph
        run: python harness.py --scenario scenarios/s2_budget_exhaustion.yaml --frameworks langchain,langgraph --output results/langchain.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: results-langchain
          path: results/

  differential-crewai:
    runs-on: ubuntu-latest
    needs: mock-llm-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with CrewAI
        run: pip install -e ".[crewai,dev]"

      - name: Run S2 against CrewAI
        run: python harness.py --scenario scenarios/s2_budget_exhaustion.yaml --frameworks crewai --output results/crewai.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: results-crewai
          path: results/

  differential-adk:
    runs-on: ubuntu-latest
    needs: mock-llm-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with Google ADK
        run: pip install -e ".[adk,dev]"

      - name: Run S2 against Google ADK
        run: python harness.py --scenario scenarios/s2_budget_exhaustion.yaml --frameworks adk --output results/adk.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: results-adk
          path: results/
