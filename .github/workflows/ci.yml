name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/ -v

      - name: OTel comparison
        run: python otel_comparison.py

      - name: Cost divergence
        run: python cost_divergence.py

      - name: Span capture
        run: python otel_span_capture.py

      - name: Report generation
        run: python report_generator.py

      - name: CLI smoke test
        run: |
          python cli.py compare
          python cli.py cost
          python cli.py spans
          python cli.py dimensions

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agent-budget-semantics .

      - name: Run comparison in Docker
        run: docker run --rm agent-budget-semantics compare

      - name: Run cost analysis in Docker
        run: docker run --rm agent-budget-semantics cost

  per-framework:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - autogen
          - langchain
          - langgraph
          - crewai
          - adk
          - semantic-kernel
          - anthropic
          - llamaindex
          - agno

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install base + framework
        run: pip install -e ".[${{ matrix.framework }}]"

      - name: Run S2 scenario
        run: |
          python harness.py --scenario scenarios/s2_budget_exhaustion.yaml --frameworks ${{ matrix.framework }}
        continue-on-error: true
