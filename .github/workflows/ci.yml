name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/ -v

      - name: No synthesized token budgets
        # Enforce the OTel semconv-genai#425 MUST NOT clause across the
        # current 11-framework output. Fails the build if any runner starts
        # emitting a token_budget.limit that looks like iteration_limit ×
        # per_call_max_tokens.
        run: |
          python -c "
          from otel_comparison import simulate_otel_attributes
          from synthesis_detector import enforce_no_synthesis
          results = simulate_otel_attributes(
              scenario_name='S2-budget-exhaustion',
              llm_calls=4, tool_calls=3,
              total_tokens=478, budget_limit=3,
          )
          entries = [{'framework': fw, **attrs} for fw, attrs in results.items()]
          enforce_no_synthesis(entries)
          print(f'PASS: {len(entries)} frameworks emit no synthesized token budgets')
          "

      - name: OTel comparison
        run: python otel_comparison.py

      - name: Cost divergence
        run: python cost_divergence.py

      - name: Span capture
        run: python otel_span_capture.py

      - name: Report generation
        run: python report_generator.py

      - name: CLI smoke test
        run: |
          python cli.py compare
          python cli.py cost
          python cli.py spans
          python cli.py dimensions

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agent-budget-semantics .

      - name: Run comparison in Docker
        run: docker run --rm agent-budget-semantics compare

      - name: Run cost analysis in Docker
        run: docker run --rm agent-budget-semantics cost

  per-framework:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - autogen
          - langchain
          - langgraph
          - crewai
          - adk
          - semantic-kernel
          - anthropic
          - llamaindex
          - agno

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install base + framework
        run: pip install -e ".[${{ matrix.framework }}]"

      - name: Run S2 scenario
        run: |
          python harness.py --scenario scenarios/S2-budget-exhaustion.yaml --frameworks ${{ matrix.framework }}
        continue-on-error: true
