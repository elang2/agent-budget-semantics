[project]
name = "agent-budget-semantics"
version = "0.1.0"
description = "Differential testing of budget enforcement semantics across AI agent frameworks"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Elankumaran Srinivasan"}
]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "agent",
    "budget",
    "differential-testing",
    "conformance",
    "opentelemetry",
    "autogen",
    "langchain",
    "crewai",
    "google-adk",
    "semantic-kernel",
    "anthropic",
    "langgraph",
    "openai-agents",
    "llm",
    "genai",
    "telemetry",
]

dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/elang2/agent-budget-semantics"
Repository = "https://github.com/elang2/agent-budget-semantics"
Issues = "https://github.com/elang2/agent-budget-semantics/issues"
Documentation = "https://github.com/elang2/agent-budget-semantics#readme"

[project.scripts]
agent-budget-semantics = "cli:main"
abs-compare = "cli:main"

[project.optional-dependencies]
autogen = ["autogen-agentchat>=0.4", "autogen-ext>=0.4"]
openai-agents = ["openai-agents>=0.1"]
langchain = ["langchain>=0.3", "langchain-openai>=0.3"]
langgraph = ["langgraph>=0.3"]
crewai = ["crewai>=0.100"]
adk = ["google-adk>=1.0"]
semantic-kernel = ["semantic-kernel>=1.0"]
anthropic = ["anthropic>=0.34"]
swarm = ["openai-swarm>=0.1"]
llamaindex = ["llama-index-core>=0.11", "llama-index-llms-openai>=0.3"]
agno = ["agno>=1.0"]
all = [
    "agent-budget-semantics[autogen]",
    "agent-budget-semantics[openai-agents]",
    "agent-budget-semantics[langchain]",
    "agent-budget-semantics[langgraph]",
    "agent-budget-semantics[crewai]",
    "agent-budget-semantics[adk]",
    "agent-budget-semantics[semantic-kernel]",
    "agent-budget-semantics[anthropic]",
    "agent-budget-semantics[swarm]",
    "agent-budget-semantics[llamaindex]",
    "agent-budget-semantics[agno]",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["runners", "mock-llm"]
include = [
    "cli.py",
    "harness.py",
    "otel_comparison.py",
    "otel_span_capture.py",
    "cost_divergence.py",
    "report_generator.py",
    "scenarios/",
    "DIMENSIONS.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "runners/",
    "mock-llm/",
    "scenarios/",
    "tests/",
    "cli.py",
    "harness.py",
    "otel_comparison.py",
    "otel_span_capture.py",
    "cost_divergence.py",
    "report_generator.py",
    "DIMENSIONS.md",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
