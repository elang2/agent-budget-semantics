[project]
name = "agent-budget-semantics"
version = "0.1.0"
description = "Differential testing of budget enforcement semantics across AI agent frameworks"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Elankumaran Srinivasan"}
]
keywords = [
    "agent",
    "budget",
    "differential-testing",
    "conformance",
    "opentelemetry",
    "autogen",
    "langchain",
    "crewai",
    "google-adk",
    "semantic-kernel",
    "anthropic",
    "langgraph",
    "openai-agents"
]

dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
autogen = ["autogen-agentchat>=0.4", "autogen-ext>=0.4"]
openai-agents = ["openai-agents>=0.1"]
langchain = ["langchain>=0.3", "langchain-openai>=0.3"]
langgraph = ["langgraph>=0.3"]
crewai = ["crewai>=0.100"]
adk = ["google-adk>=1.0"]
semantic-kernel = ["semantic-kernel>=1.0"]
anthropic = ["anthropic>=0.34"]
swarm = ["openai-swarm>=0.1"]
llamaindex = ["llama-index-core>=0.11", "llama-index-llms-openai>=0.3"]
agno = ["agno>=1.0"]
all = [
    "agent-budget-semantics[autogen]",
    "agent-budget-semantics[openai-agents]",
    "agent-budget-semantics[langchain]",
    "agent-budget-semantics[langgraph]",
    "agent-budget-semantics[crewai]",
    "agent-budget-semantics[adk]",
    "agent-budget-semantics[semantic-kernel]",
    "agent-budget-semantics[anthropic]",
    "agent-budget-semantics[swarm]",
    "agent-budget-semantics[llamaindex]",
    "agent-budget-semantics[agno]",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["runners", "mock-llm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
